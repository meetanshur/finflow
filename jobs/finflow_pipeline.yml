resources:
  jobs:
    finflow_pipeline:
      name: finflow_pipeline
      tasks:
        - task_key: bronze_load
          notebook_task:
            notebook_path: /Workspace/Users/meetanshurathod12@gmail.com/finflow/notebooks/01_bronze_load
            base_parameters:
              source_file: raw_transactions.csv
              write_mode: overwrite
            source: WORKSPACE
          environment_key: Default
        - task_key: silver_clean
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: /Workspace/Users/meetanshurathod12@gmail.com/finflow/notebooks/02_silver_clean
            source: WORKSPACE
          environment_key: Default
        - task_key: dbt_build
          depends_on:
            - task_key: silver_clean
          dbt_task:
            project_directory: finflow_core
            commands:
              - dbt deps
              - dbt seed
              - dbt snapshot
              - dbt run
              - dbt test
            schema: staging
            warehouse_id: 416cb87506819a12
            catalog: workspace
            source: GIT
          environment_key: dbt-default
      git_source:
        git_url: https://github.com/meetanshur/finflow
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
